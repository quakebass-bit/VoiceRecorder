<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MP3 Voice Recorder</title>
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; padding: 24px; background: #0f172a; color: #f8fafc; user-select: none;
    }
    .container { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 420px; gap: 16px; }
    
    #timer {
      font-size: 46px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      color: #38bdf8;
      margin-bottom: 4px;
    }

    button {
      width: 100%; min-height: 90px; padding: 20px; font-size: 22px; font-weight: 700;
      cursor: pointer; border: none; border-radius: 20px; transition: all 0.2s ease;
      touch-action: manipulation; display: flex; align-items: center; justify-content: center; text-align: center;
    }
    button:active { transform: scale(0.97); }
    #recordBtn { background: #2563eb; color: #ffffff; box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4); }
    #recordBtn.recording { background: #dc2626; box-shadow: 0 10px 25px -5px rgba(220, 38, 38, 0.5); animation: pulse 1.6s infinite ease-in-out; }
    #pauseBtn { display: none; background: #f59e0b; color: #0f172a; }
    #pauseBtn.paused { background: #10b981; color: #ffffff; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
    #status { font-size: 16px; color: #94a3b8; text-align: center; min-height: 24px; }
  </style>
</head>
<body>

  <div class="container">
    <div id="timer">00:00</div>
    <button id="recordBtn">Start Recording (MP3)</button>
    <button id="pauseBtn">Pause</button>
    <div id="status"></div>
  </div>

  <audio id="silentAudio" loop playsinline style="display:none;"></audio>

  <script>
    const recordBtn = document.getElementById('recordBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const status = document.getElementById('status');
    const timerDisplay = document.getElementById('timer');
    const silentAudio = document.getElementById('silentAudio');

    let audioContext = null;
    let mediaStream = null;
    let processor = null;
    let input = null;
    let mp3Encoder = null;
    let mp3Data = [];
    let isRecording = false;
    let isPaused = false;

    // Timer variables
    let timerInterval = null;
    let startTime = 0;
    let accumulatedTime = 0;

    // Генерация бесшумного закольцованного WAV-трека для удержания аудиосессии в фоне
    function setupSilentAudio() {
      // 1-секундный тихий WAV (base64)
      silentAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==";
    }
    setupSilentAudio();

    // Защита от засыпания при сворачивании
    document.addEventListener('visibilitychange', () => {
      if (audioContext && audioContext.state === 'suspended' && isRecording && !isPaused) {
        audioContext.resume();
      }
      if (!document.hidden && isRecording && !isPaused) {
        updateTimerDisplay();
      }
    });

    function formatTime(ms) {
      const totalSec = Math.floor(ms / 1000);
      const m = String(Math.floor(totalSec / 60)).padStart(2, '0');
      const s = String(totalSec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateTimerDisplay() {
      if (!isRecording) return;
      const currentElapsed = isPaused ? accumulatedTime : accumulatedTime + (Date.now() - startTime);
      timerDisplay.textContent = formatTime(currentElapsed);
    }

    function startTimer() {
      startTime = Date.now();
      timerInterval = setInterval(updateTimerDisplay, 250);
    }

    function pauseTimer() {
      clearInterval(timerInterval);
      accumulatedTime += Date.now() - startTime;
      updateTimerDisplay();
    }

    function resumeTimer() {
      startTime = Date.now();
      timerInterval = setInterval(updateTimerDisplay, 250);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      accumulatedTime = 0;
      timerDisplay.textContent = '00:00';
    }

    pauseBtn.addEventListener('click', () => {
      if (!isRecording) return;
      isPaused = !isPaused;

      if (isPaused) {
        pauseTimer();
        silentAudio.pause();
        recordBtn.classList.remove('recording');
        pauseBtn.textContent = 'Resume Recording';
        pauseBtn.classList.add('paused');
        status.textContent = 'Recording paused';
      } else {
        resumeTimer();
        silentAudio.play().catch(() => {});
        recordBtn.classList.add('recording');
        pauseBtn.textContent = 'Pause';
        pauseBtn.classList.remove('paused');
        status.textContent = 'Recording MP3...';
      }
    });

    recordBtn.addEventListener('click', async () => {
      if (isRecording) {
        // Остановка и сохранение
        isRecording = false;
        isPaused = false;
        resetTimer();
        silentAudio.pause();

        recordBtn.textContent = 'Start Recording (MP3)';
        recordBtn.classList.remove('recording');
        pauseBtn.style.display = 'none';
        pauseBtn.classList.remove('paused');
        status.textContent = 'Converting to MP3...';

        if (processor) processor.disconnect();
        if (input) input.disconnect();
        if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());

        // Завершение сжатия
        const endBuf = mp3Encoder.flush();
        if (endBuf.length > 0) mp3Data.push(endBuf);

        const blob = new Blob(mp3Data, { type: 'audio/mp3' });
        const url = URL.createObjectURL(blob);

        const now = new Date();
        const f = (n) => String(n).padStart(2, '0');
        const fileName = `${f(now.getDate())}-${f(now.getMonth()+1)}-${now.getFullYear()}-${f(now.getHours())}-${f(now.getMinutes())}.mp3`;

        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        status.textContent = `Saved: ${fileName}`;
        return;
      }

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
        });

        // Запуск фиктивного тихого аудио на жест пользователя (держит сессию на iOS/Android)
        try {
          await silentAudio.play();
        } catch (e) {
          console.warn('Audio keep-alive warning:', e);
        }

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }

        const sampleRate = audioContext.sampleRate;
        mp3Encoder = new lamejs.Mp3Encoder(1, sampleRate, 64);
        mp3Data = [];

        input = audioContext.createMediaStreamSource(mediaStream);
        processor = audioContext.createScriptProcessor(4096, 1, 1);

        processor.onaudioprocess = (e) => {
          if (!isRecording || isPaused) return;
          const float32Arr = e.inputBuffer.getChannelData(0);
          
          const int16Arr = new Int16Array(float32Arr.length);
          for (let i = 0; i < float32Arr.length; i++) {
            let s = Math.max(-1, Math.min(1, float32Arr[i]));
            int16Arr[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
          }

          const mp3buf = mp3Encoder.encodeBuffer(int16Arr);
          if (mp3buf.length > 0) {
            mp3Data.push(mp3buf);
          }
        };

        input.connect(processor);
        processor.connect(audioContext.destination);

        isRecording = true;
        startTimer();

        recordBtn.textContent = 'Stop and Save';
        recordBtn.classList.add('recording');
        pauseBtn.style.display = 'flex';
        status.textContent = 'Recording MP3...';

      } catch (err) {
        status.textContent = 'Microphone access error: ' + err.message;
      }
    });
  </script>
</body>
</html>
